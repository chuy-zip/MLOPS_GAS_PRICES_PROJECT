name: Tests

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Instalar el paquete
        run: pip install -e ".[test]"

      - name: Traer los datos de main para comparar
        run: |
          for archivo in $(git ls-tree -r --name-only origin/main data); do
            mkdir -p "$RUNNER_TEMP/base/$(dirname "$archivo")"
            git show "origin/main:$archivo" > "$RUNNER_TEMP/base/$archivo"
          done

      - name: Correr los tests
        env:
          DATOS_BASE: ${{ runner.temp }}/base
        run: pytest -v
