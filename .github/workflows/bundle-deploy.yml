name: Bundle deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: bundle-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - uses: databricks/setup-cli@main

      - name: Validar
        run: databricks bundle validate -t prod

      - name: Desplegar
        run: databricks bundle deploy -t prod

      # Crea las tablas que falten según databricks/sql/tablas.sql.
      # bundle run espera a que el job termine, salvo que se use --no-wait.
      - name: Crear tablas
        run: databricks bundle run gas_price_setup -t prod
