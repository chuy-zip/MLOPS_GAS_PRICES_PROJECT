bundle:
  name: gas_price

include:
  - resources/*.yml

# Databricks solo necesita los notebooks. El Excel se lee desde el repo público.
sync:
  exclude:
    - docs/**
    - data/**
    - .github/**
    - tests/**
    - infra/**
    - scripts/**
    - README.md

# El bundle vive en /Workspace/Shared a propósito: es un ambiente compartido por el equipo.
permissions:
  - level: CAN_MANAGE
    group_name: users

variables:
  catalogo:
    description: Catálogo de Unity Catalog del proyecto
    default: gas_price
  esquema_bronze:
    description: Esquema de la capa de bronce
    default: bronze
  esquema_silver:
    description: Esquema de la capa de plata
    default: silver
  esquema_gold:
    description: Esquema de la capa de oro
    default: gold

targets:
  prod:
    default: true
    workspace:
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
