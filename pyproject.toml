[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gas_price"
version = "0.1.0"
description = "Código compartido del proyecto de monitoreo del precio de la gasolina"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.24",
    "openpyxl>=3.1",
    "python-calamine>=0.2",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
