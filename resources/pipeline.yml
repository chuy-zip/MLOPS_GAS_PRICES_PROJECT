resources:
  jobs:
    gas_price_pipeline:
      name: equipo-01-pipeline
      description: Pipeline de bronce a oro, entrenamiento y predicción de la semana siguiente. Corre cada martes, cuando el MEM publica los precios de referencia.
      max_concurrent_runs: 1
      tags:
        proyecto: gas_price
        equipo: equipo-01

      # Cada martes a las 8:00, hora de Guatemala.
      schedule:
        quartz_cron_expression: "0 0 8 ? * TUE"
        timezone_id: America/Guatemala
        pause_status: UNPAUSED

      email_notifications:
        on_failure:
          - ${var.correo_alertas}

      parameters:
        - name: catalogo
          default: ${var.catalogo}
        - name: esquema_bronze
          default: ${var.esquema_bronze}
        - name: esquema_silver
          default: ${var.esquema_silver}
        - name: esquema_gold
          default: ${var.esquema_gold}
        - name: repo_raw
          default: ${var.repo_raw}

      tasks:
        - task_key: ingesta_imagenes
          notebook_task:
            notebook_path: ../databricks/notebooks/10_ingesta_imagenes.py

        - task_key: ingesta_mem
          notebook_task:
            notebook_path: ../databricks/notebooks/11_ingesta_mem.py

        - task_key: ingesta_eia
          notebook_task:
            notebook_path: ../databricks/notebooks/12_ingesta_eia.py

        - task_key: silver_mem
          depends_on:
            - task_key: ingesta_mem
          notebook_task:
            notebook_path: ../databricks/notebooks/20_silver_mem.py

        - task_key: silver_eia
          depends_on:
            - task_key: ingesta_eia
          notebook_task:
            notebook_path: ../databricks/notebooks/22_silver_eia.py

        - task_key: silver_imagenes
          depends_on:
            - task_key: ingesta_imagenes
          notebook_task:
            notebook_path: ../databricks/notebooks/21_silver_imagenes.py

        - task_key: gold
          depends_on:
            - task_key: silver_mem
            - task_key: silver_eia
            - task_key: silver_imagenes
          notebook_task:
            notebook_path: ../databricks/notebooks/30_gold.py

        - task_key: entrenamiento
          depends_on:
            - task_key: gold
          notebook_task:
            notebook_path: ../databricks/notebooks/40_entrenamiento.py

        - task_key: predicciones
          depends_on:
            - task_key: entrenamiento
          notebook_task:
            notebook_path: ../databricks/notebooks/50_predicciones.py
